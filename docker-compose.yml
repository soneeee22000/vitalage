services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitalage
      POSTGRES_PASSWORD: vitalage_dev
      POSTGRES_DB: vitalage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalage"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vitalage:vitalage_dev@db:5432/vitalage
      DATABASE_URL_SYNC: postgresql://vitalage:vitalage_dev@db:5432/vitalage
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: development
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
